name: Slate
options:
  bundleIdPrefix: io.github.imsumitkumar

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2

targets:
  Slate:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: ora
        excludes:
          - "Assets/Icons/**"
    resources:
      - path: ora/Shared/EmojiPicker/emoji-set.json
      - path: ora/Resources
        optional: true
    dependencies:
      - package: Sparkle
      - package: Inject
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter

    preBuildScripts:
      - name: "Copy Icon Bundle"
        inputFiles:
          - "$(SRCROOT)/ora/Assets/Icons/SlateIcon.icon"
          - "$(SRCROOT)/ora/Assets/Icons/SlateIconDev.icon"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/SlateIcon.icon"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/SlateIconDev.icon"
        script: |
          ICON_SRC_DEV="$SRCROOT/ora/Assets/Icons/SlateIconDev.icon"
          ICON_SRC_RELEASE="$SRCROOT/ora/Assets/Icons/SlateIcon.icon"
          ICON_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Using SlateIconDev.icon for Debug build"
              cp -R "$ICON_SRC_DEV" "$ICON_DST"
          else
              echo "Using SlateIcon.icon for Release build"
              cp -R "$ICON_SRC_RELEASE" "$ICON_DST"
          fi

    info:
      path: ora/Info/Info.plist
      properties:
        SUFeedURL: "https://imsumitkumar.github.io/Slate/appcast.xml"
        SUPublicEDKey: "qFHnOWr7eqkTiPXFkKay60DRhrH9fl+6iXovJCYBAOU="
        SUEnableAutomaticChecks: YES
        SUEnableInstallerLauncherService: YES
        CFBundleURLTypes:
          - CFBundleURLName: Slate
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser

    entitlements:
      path: ora/Info/Slate.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.movies.read-only: true
        com.apple.security.assets.music.read-only: true
        com.apple.security.assets.pictures.read-only: true
        com.apple.security.cs.allow-jit: true
        # Required because Slate is ad-hoc signed. Under the hardened runtime,
        # library validation demands that embedded frameworks carry the same Team
        # ID as the host process; an ad-hoc signature has no Team ID at all, so
        # Sparkle.framework cannot be loaded without this. The alternative is
        # turning the hardened runtime off entirely, which gives up more.
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.print: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spks"
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spki"

    settings:
      base:
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_NAME: Slate
        PRODUCT_BUNDLE_IDENTIFIER: io.github.imsumitkumar.slate
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUFeedURL: "https://imsumitkumar.github.io/Slate/appcast.xml"
        SUPublicEDKey: "qFHnOWr7eqkTiPXFkKay60DRhrH9fl+6iXovJCYBAOU="
        SUEnableAutomaticChecks: YES
        SUEnableInstallerLauncherService: YES
        # Ad-hoc signing: no Apple Developer account, no team, no provisioning profile.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: ora/Info/Slate.entitlements
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: SlateIconDev
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: SlateIcon
          ENABLE_HARDENED_RUNTIME: YES

  SlateTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: oraTests
    dependencies:
      - target: Slate
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Slate.app/Contents/MacOS/Slate"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.imsumitkumar.slate.tests
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"

schemes:
  Slate:
    shared: true
    build:
      targets:
        Slate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlateTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
